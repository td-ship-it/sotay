<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cổng liên kết Trường Dược</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: dải header màu dược, lưới thẻ liên kết ở giữa, footer gọn phía dưới */
:root {
  --bg: #f2f7f4;
  --surface: #ffffff;
  --fg: #14301f;
  --muted: #5a7264;
  --line: #d6e5dc;
  --brand: #05783d;
  --brand-ink: #ffffff;
  --brand-soft: #e1f2e8;
  --accent: #c8942e;
  --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a18; --surface: #16241f; --fg: #e3eeeb; --muted: #93aaa4;
    --line: #263a35; --brand: #13463e; --brand-ink: #eaf6f2; --brand-soft: #1d3a33;
    --accent: #e0b25a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a18; --surface: #16241f; --fg: #e3eeeb; --muted: #93aaa4;
  --line: #263a35; --brand: #13463e; --brand-ink: #eaf6f2; --brand-soft: #1d3a33;
  --accent: #e0b25a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  display: flex; flex-direction: column; min-height: 100vh;
}
.wrap { width: 100%; max-width: 1040px; margin-inline: auto; padding-inline: 20px; }

/* Header */
/* Header giữ nền trắng ở cả hai chế độ để logo hiển thị đúng màu gốc */
header { background: #ffffff; border-bottom: 4px solid #05783d; }
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 12px; }
.logo { display: block; line-height: 0; }
.logo img { height: 72px; width: auto; max-width: 100%; }
.tag { font-size: .78rem; font-weight: 600; color: #05783d; text-transform: uppercase; letter-spacing: .08em; border: 1px solid #b9dcc8; border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Main */
main { flex: 1; padding-block: 36px 48px; }
.intro { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.intro h2 { font-size: 1.5rem; margin: 0 0 4px; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); max-width: 60ch; }
.search { position: relative; flex: 0 1 280px; min-width: 0; }
.search input {
  width: 100%; font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px 9px 36px;
}
.search input:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: transparent; }
.search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card {
  display: flex; flex-direction: column; gap: 12px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 20px; text-decoration: none; color: inherit;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.card:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(5,120,61,.14); }
.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card-top { display: flex; align-items: center; justify-content: space-between; }
.icon {
  width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
  background: var(--brand-soft); color: var(--brand);
}
:root[data-theme="dark"] .icon { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .icon { color: var(--accent); } }
.icon svg { width: 22px; height: 22px; }
.arrow { width: 18px; height: 18px; color: var(--muted); transition: color .15s, translate .15s; }
.card:hover .arrow { color: var(--brand); translate: 3px -3px; }
.card h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
.card p { margin: 0; color: var(--muted); font-size: .92rem; }
.url {
  margin-top: auto; padding-top: 12px; border-top: 1px dashed var(--line);
  font-family: var(--font-mono); font-size: .78rem; color: var(--muted);
  overflow-wrap: anywhere;
}
.empty { color: var(--muted); padding: 24px 0; }

/* Footer */
footer { border-top: 1px solid var(--line); background: var(--surface); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding-block: 16px; font-size: .85rem; color: var(--muted); }
footer strong { color: var(--fg); font-weight: 600; }

@media (max-width: 480px) {
  .search { flex-basis: 100%; }
  .logo img { height: 52px; }
  .tag { display: none; }
}
@media (prefers-reduced-motion: reduce) { .card, .arrow { transition: none; } .card:hover { transform: none; } }
</style>
</head>

<main>
  <div class="wrap">
    <div class="intro">
      <div>
        <h2>Truy cập nhanh</h2>
        <p>Chọn ứng dụng cần sử dụng. Mỗi liên kết mở trong một thẻ mới.</p>
      </div>
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Tìm ứng dụng…" aria-label="Tìm ứng dụng">
      </label>
    </div>

    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Không tìm thấy ứng dụng phù hợp.</p>
  </div>
</main>

<footer>
  <div class="wrap">
    <span><strong>Phòng Quản trị tổng hợp</strong> · Trường Dược</span>
    <span id="year"></span>
  </div>
</footer>

<script>
// Thêm liên kết mới: chỉ cần thêm một dòng vào danh sách này
const LINKS = [
  {
    title: "Nghỉ phép năm",
    desc: "Đăng ký và theo dõi số ngày nghỉ phép năm của viên chức, người lao động.",
    url: "https://npn.truongduoc.workers.dev/",
    icon: "calendar"
  },
  {
    title: "Thông tin Thi đua khen thưởng",
    desc: "Tra cứu thông tin, danh hiệu và kết quả thi đua khen thưởng.",
    url: "https://tdkt.truongduoc.workers.dev/",
    icon: "award"
  },
  {
    title: "Đánh giá VC-NLĐ",
    desc: "Đánh giá, xếp loại chất lượng viên chức và người lao động.",
    url: "https://danhgia.truongduoc.workers.dev/",
    icon: "check"
  }
];

const ICONS = {
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M14 14h2M8 17h2"/>',
  award: '<circle cx="12" cy="9" r="6"/><path d="M8.5 13.9L7 22l5-3 5 3-1.5-8.1"/>',
  check: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 12l3 3 5-6"/>',
  link: '<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>'
};

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");

function svg(paths) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function norm(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase(); }

function render(q) {
  const k = norm(q || "");
  const list = LINKS.filter(l => !k || norm(l.title + " " + l.desc).includes(k));
  grid.innerHTML = list.map(l => `
    <a class="card" href="${esc(l.url)}" target="_blank" rel="noopener">
      <div class="card-top">
        <span class="icon">${svg(ICONS[l.icon] || ICONS.link)}</span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
      </div>
      <h3>${esc(l.title)}</h3>
      <p>${esc(l.desc)}</p>
      <span class="url">${esc(l.url.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</span>
    </a>`).join("");
  empty.hidden = list.length > 0;
}

document.getElementById("q").addEventListener("input", e => render(e.target.value));
document.getElementById("year").textContent = "© " + new Date().getFullYear();
render("");
</script>
